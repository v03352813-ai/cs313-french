        <h1 style="font-size: 26px; font-weight: bold; color: #80142a; margin-bottom: 16px;">CS313 法语研习社 · 考研二外与 DELF 欧标全真机考备考系统</h1>
        <p style="font-size: 15px; color: #475569; margin-bottom: 20px;">面向全国高校硕士研究生统一招生考试【考研二外法语（241/242/243）】、全国大学法语四级考试（CFT-4）与法国教育部官方 DELF 欧标认证（A1~B2）的专业全真备考与法语自学平台。</p>

        <h2 style="font-size: 20px; font-weight: bold; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 24px;">一、 核心教研模块与功能体系</h2>
        
        <h3 style="font-size: 16px; font-weight: bold; color: #9b1b36; margin-top: 16px;">1. 官方权威真题全真大考场</h3>
        <p>涵盖考研二外统考真题、大学法语四级冲刺大卷与 DELF 欧标模考。标准单选、语法填空与短文填空题型全真模拟，支持全卷计时作答、提交后出分、正误判定与深度考点归因解析。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #9b1b36; margin-top: 16px;">2. 动词全时态极速变位器（Conjugation Engine）</h3>
        <p>涵盖第一组、第二组规则动词及第三组不规则动词（avoir, être, aller, faire, venir等）。直陈式现在时、复合过去时、未完成过去时、愈过去时、简单将来时、条件式与虚拟式一秒速查与对比推导，突破“变位记不住”的瓶颈。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #9b1b36; margin-top: 16px;">3. 35音标发音实验室与连音联诵（Liaison）动态指南</h3>
        <p>系统解析清浊辅音、元音及鼻化元音发音规则。独家图解强制联诵、禁止联诵与自由联诵三大黄金定律，标注文明省音规则，彻底解决听力卡顿问题。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #9b1b36; margin-top: 16px;">4. 5,000+ 考纲词汇粉蓝阴阳性速记与艾宾浩斯复习（SRS）</h3>
        <p>严格标注单词阴阳性颜色画框标记、常用复数变化、动词介词固定搭配（à / de）。内置 SRS 遗忘曲线复习机制，智能沉淀个人错词本。</p>

        <h3 style="font-size: 16px; font-weight: bold; color: #9b1b36; margin-top: 16px;">5. 经典名著与影视原声精学切片</h3>
        <p>精选《小王子》《天使爱美丽》等经典双语原声语料切片，配备逐句慢速精听、语音音标对照与语法点精拆。</p>

        <h2 style="font-size: 20px; font-weight: bold; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 24px;">二、 核心考点与攻坚大纲</h2>
        <ul style="padding-left: 20px; margin-top: 12px; color: #334155;">
          <li><strong>词法重点</strong>：冠词（定冠词/不定冠词/部分冠词）用法判断、直接/间接宾语人称代词、副代词 y 与 en 的前置位置与双代词排序规则。</li>
          <li><strong>时态语态</strong>：复合过去时与未完成过去时的精准语境辨析、主有代词与指示代词搭配、被动态配合法则。</li>
          <li><strong>高阶句式</strong>：虚拟式在主观愿望/怀疑从句中的触发条件、关系代词（qui, que, où, dont）引导的从句精析。</li>
        </ul>
